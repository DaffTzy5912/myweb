<!DOCTYPE html>
<html>
<head>
  <title>Tulis Posting</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Tulis Posting Baru</h2>
  <form id="postForm">
    <input type="text" id="title" placeholder="Judul" required />
    <textarea id="content" placeholder="Isi posting..." required></textarea>
    <button type="submit">Simpan</button>
  </form>

  <script>
    document.getElementById('postForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('token');
      if (!token) return alert("Harus login dulu!");

      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      const res = await fetch('https://api-blog-anda.vercel.app/posts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ title, content })
      });

      const data = await res.json();
      if (data.success) {
        alert("Posting berhasil!");
        window.location.href = "index.html";
      } else {
        alert("Gagal menyimpan posting.");
      }
    });
  </script>
</body>
</html>
