<!DOCTYPE html>
<html>
<head>
  <title>Blog Publik</title>
</head>
<body>
  <h1>Blog</h1>
  <div id="posts"></div>
  <script>
    fetch('/api/posts')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('posts');
        data.forEach(post => {
          const div = document.createElement('div');
          div.innerHTML = `<h3>${post.title}</h3><p>${post.content}</p>`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
